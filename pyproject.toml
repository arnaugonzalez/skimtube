[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "skimtube"
version = "0.1.0"
dynamic = ["readme"]
description = "Turn the YouTube channels you never have time to watch into a searchable Markdown knowledge base for you and your agents."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arnau González" }]
keywords = ["youtube", "llm", "rss", "markdown", "knowledge-base", "obsidian", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["yt-dlp>=2024.12.13"]

[project.urls]
Homepage = "https://github.com/arnaugonzalez/skimtube"
Issues = "https://github.com/arnaugonzalez/skimtube/issues"
Changelog = "https://github.com/arnaugonzalez/skimtube/blob/main/CHANGELOG.md"

[project.scripts]
skimtube = "skimtube.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/skimtube/prompts.py" = ["E501"]

# PyPI does not resolve relative paths: point images at the files on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(docs/[^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/arnaugonzalez/skimtube/main/\1"'
